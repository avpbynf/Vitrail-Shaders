# A tag is the only thing here that publishes anything, and it publishes what this history builds
# rather than what a machine happened to have in build/libs.
#
# The version lives in one place, mod_version in gradle.properties, which neoforge.mods.toml
# interpolates. A tag name repeats it, because a human types it, and the run compares the two and
# stops before anything is uploaded when they disagree: that is the one mistake that would otherwise
# ship a jar under a version number nothing inside it agrees with.
#
# The jar is found rather than named. Its name is built out of archivesName and archiveVersion in
# neoforge/build.gradle, and spelling it a second time here would be a second home for it, out of
# step from whichever of the two moved first.
#
# **The stores are mirrored from HERE and not from a workflow of their own**, and that is not a
# matter of taste. A release this job creates is authored by the token the job runs under, and a
# release published by that token starts no further workflow at all, so a file listening for the
# release event would never wake. The other half of the reason is cheaper: one job means one build,
# and what CurseForge and Modrinth serve is then the same bytes GitHub serves.

name: release

on:
  push:
    tags:
      # A digit after the v, so that a marker tag beginning with that letter is refused here rather
      # than by the check below, which would have queued a runner and checked the tree out first.
      - "v[0-9]*"
  # For a release already out. The changelog the stores are given is the release body as it stands
  # when the run starts, so a body written by hand after the tag was pushed reaches them by running
  # this again on that tag, and by no other road.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of a release already out, to build and send again
        required: true

# Creating a release and attaching a file to it is a write, and it is the only one asked for.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Settle which tag is being released
        id: which
        env:
          DISPATCHED: ${{ inputs.tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCHED"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.which.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Read out of gradle.properties rather than asked of Gradle, so that a tag that disagrees
      # fails before Minecraft is decompiled rather than after.
      - name: Check the tag against the version
        id: version
        env:
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          # Spaces around the separator and a colon in place of the equals are both legal in a
          # properties file and both accepted by Gradle, so reading only one spelling would report
          # a line that is right there as missing.
          version="$(sed -n 's/^[[:space:]]*mod_version[[:space:]]*[=:][[:space:]]*//p' \
            gradle.properties | tr -d '[:space:]')"
          tagged="${TAG#v}"

          # Told apart from a mismatch on purpose: an empty answer means the line was renamed,
          # commented out or moved, and reporting that as a bad tag sends whoever reads it to the
          # wrong file.
          if [ -z "$version" ]; then
            echo "::error::gradle.properties has no mod_version line"
            exit 1
          fi

          if [ "$tagged" != "$version" ]; then
            echo "::error::tag $TAG names $tagged and gradle.properties names $version"
            exit 1
          fi

          # What marks a release as a pre-release is the version itself: an identifier after a dash
          # is what 0.1.0-alpha.1 has and what a finished version does not.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # The same gradlew build a contributor runs. What it refuses is whatever build.gradle refuses
      # on the day this runs.
      - run: ./gradlew build

      - name: Find the jar
        id: jar
        run: |
          glob="build/libs/vitrail-neoforge-*.jar"
          shopt -s nullglob
          jars=($glob)
          if [ ${#jars[@]} -ne 1 ]; then
            # Naming the pattern and listing the directory, because the way this fails is a rename
            # in neoforge/build.gradle, and "found 0" beside a folder that visibly holds a jar sends
            # whoever reads it looking for a build that did not happen.
            echo "::error::$glob matched ${#jars[@]} files, and build/libs holds: $(ls build/libs)"
            exit 1
          fi

          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TAG: ${{ steps.which.outputs.tag }}
          JAR: ${{ steps.jar.outputs.path }}
        run: |
          # Creating refuses a tag that already carries a release, so a re-run of a job that died
          # after the release was made would have no way back other than deleting a public release.
          # Uploading over it is that way back, and the edit is what finishes the job the dead run
          # left half done: creating with an asset makes the release a draft and publishes it only
          # once the upload lands, so without this line a re-run would end green on a release
          # nobody can see. It costs nothing on a release that is already published, and it is the
          # path a dispatched run ordinarily takes. Ordinarily and not always: dispatched on a tag
          # that carries no release, this makes one, which is the same thing the tag push would
          # have done and is why it is not guarded against.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" "$JAR" \
              --title "$TAG" \
              --generate-notes \
              --prerelease="$PRERELEASE"
          fi

          # Read back rather than remembered, so that a dispatched run sends whatever the body says
          # now instead of what it said when the tag went out.
          gh release view "$TAG" --json body --jq .body > changelog.md

      # One store missing its secrets does not take the other down with it: the action walks its
      # platforms and passes over any whose token is empty, so what is answered here is which of
      # the two is configured rather than whether anything is.
      - name: Which mirrors are configured
        id: mirror
        env:
          CURSEFORGE_ID: ${{ secrets.CURSEFORGE_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          # A project id is not a secret, so it is read from either tab rather than from the one
          # it was guessed to be in. What that saves is the failure this file already carries a
          # scar from: a name read from the wrong context is empty, and an empty name here reads
          # as "not configured" and takes the run green past a store it never wrote to.
          MODRINTH_ID: ${{ secrets.MODRINTH_ID || vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          curseforge=false
          modrinth=false

          # Both halves, because a token without an id is not passed over: it reaches the store and
          # fails there on a project that was never named.
          if [ -n "$CURSEFORGE_ID" ] && [ -n "$CURSEFORGE_TOKEN" ]; then
            curseforge=true
          else
            echo "::notice::CURSEFORGE_ID or CURSEFORGE_TOKEN is not set, so CurseForge is skipped"
          fi

          if [ -n "$MODRINTH_ID" ] && [ -n "$MODRINTH_TOKEN" ]; then
            modrinth=true
          else
            echo "::notice::MODRINTH_ID or MODRINTH_TOKEN is not set, so Modrinth is skipped"
          fi

          echo "curseforge=$curseforge" >> "$GITHUB_OUTPUT"
          echo "modrinth=$modrinth" >> "$GITHUB_OUTPUT"

      # Every flag the uploaded file needs is given rather than left to be inferred. The two that
      # were learned the hard way on another mod of this account, each added in a commit of its own
      # after a first upload had gone out without them, are `environment` and `java`.
      #
      # Two are left to the action on purpose, and both read the jar rather than this file.
      #
      # The version type: the action takes the version out of the jar's own metadata, falling back
      # to its file name, and tells an alpha from a beta from a release there. A rule written here
      # would have to keep that vocabulary in step by hand, and the string it reads is the one this
      # job already checked the tag against.
      #
      # The dependencies: given no list, the action reads one out of the jar's own
      # neoforge.mods.toml, so Sodium and Chloride go up as relations of the FILE as well, beside
      # whatever Default Relations the project itself carries. Their names there are the mod ids,
      # and a name the store does not know is dropped rather than failing the upload, which is why
      # the project's own relations are the ones to rely on. On Modrinth the drop is what happens
      # to `minecraft` and `neoforge`, which are no projects of that store, while `sodium` and
      # `chloride` are its slugs for them as well.
      #
      # `java` is CurseForge's alone. Modrinth has no field for it and the action never sends it
      # there, so the line is not the pair of a missing one.
      - name: Mirror to the stores
        if: steps.mirror.outputs.curseforge == 'true' || steps.mirror.outputs.modrinth == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # A token is emptied rather than left to fail when its pair above is half set, an empty
          # token being exactly what makes the action pass a store over.
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          curseforge-token: ${{ steps.mirror.outputs.curseforge == 'true' && secrets.CURSEFORGE_TOKEN || '' }}
          modrinth-id: ${{ secrets.MODRINTH_ID || vars.MODRINTH_ID }}
          modrinth-token: ${{ steps.mirror.outputs.modrinth == 'true' && secrets.MODRINTH_TOKEN || '' }}
          files: ${{ steps.jar.outputs.path }}
          name: ${{ steps.which.outputs.tag }}
          changelog-file: changelog.md
          loaders: neoforge
          game-versions: "26.2"
          environment: client
          java: 25
