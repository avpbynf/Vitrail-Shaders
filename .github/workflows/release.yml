# A tag is the only thing here that publishes anything, and it publishes what this history builds
# rather than what a machine happened to have in build/libs.
#
# The version lives in one place, mod_version in gradle.properties, which neoforge.mods.toml
# interpolates. A tag name repeats it, because a human types it, and the run compares the two and
# stops before anything is uploaded when they disagree: that is the one mistake that would otherwise
# ship a jar under a version number nothing inside it agrees with.
#
# What ships is ONE jar per game the tree builds for, the merged one the root build assembles, and
# it runs under either loader: each loader reads its own metadata file and ignores the other's, so
# the union of the two loader jars is a mod to both of them. The games are the files under versions/,
# every one of them built from the same commit, and each jar's metadata refuses the others. A jar is
# found rather than named. Its name is built out of archivesName and archiveVersion on the mergedJar
# task in the root build.gradle, and spelling it a second time here would be a second home for it,
# out of step the day the first one moves.
#
# One upload per store and per game, filed under both loaders at once, which both stores take on a
# single file. The game is what tells two rows of one release apart, so it goes after a plus in the
# version a store is given, the way it already does in the jar's name.
#
# **The stores are mirrored from HERE and not from a workflow of their own**, and that is not a
# matter of taste. A release this job creates is authored by the token the job runs under, and a
# release published by that token starts no further workflow at all, so a file listening for the
# release event would never wake. The other half of the reason is cheaper: the jars are built once,
# in the release job, and travel to the mirroring job as an artifact, so what CurseForge and
# Modrinth serve is the same bytes GitHub serves.

name: release

on:
  push:
    tags:
      # A digit after the v, so that a marker tag beginning with that letter is refused here rather
      # than by the check below, which would have queued a runner and checked the tree out first.
      - "v[0-9]*"
  # For a release already out. The changelog the stores are given is the release body as it stands
  # when the run starts, and on a first run that body is this version's entry in CHANGELOG.md. So a
  # body edited by hand after the tag was pushed reaches the stores by running this again on that
  # tag, and by no other road.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of a release already out, to build and send again
        required: true

# Read unless a job says otherwise, and only the release job does. The mirroring job writes nothing
# here: mc-publish is handed no GitHub token and so passes GitHub over, and the jars reach it as an
# artifact. It is also the job running a third party's action with both store tokens in hand, so
# the write it used to inherit from this line was the one it had least use for.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    # Creating a release and attaching a file to it is a write, and it is the only one asked for.
    # Nothing else in either job needs one: the artifact the mirroring job is handed goes through
    # the runner's own artifact service, which no permission here governs.
    permissions:
      contents: write

    # What the mirroring job needs to know, the jars themselves travelling as an artifact.
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      games: ${{ steps.games.outputs.json }}
      curseforge: ${{ steps.mirror.outputs.curseforge }}
      modrinth: ${{ steps.mirror.outputs.modrinth }}

    steps:
      - name: Settle which tag is being released
        id: which
        env:
          DISPATCHED: ${{ inputs.tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCHED"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.which.outputs.tag }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 25

      # Read-only on a tag, which is the action's own default and is kept on purpose, unlike in
      # build.yml. A tag run reads the cache main wrote, and an entry it wrote itself would be
      # scoped to that one tag: read by nothing but a re-run of it, and crowding out the entries
      # build.yml keeps for dev and main.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Read out of gradle.properties rather than asked of Gradle, so that a tag that disagrees
      # fails before Minecraft is decompiled rather than after.
      - name: Check the tag against the version
        id: version
        env:
          TAG: ${{ steps.which.outputs.tag }}
        run: |
          # Spaces around the separator and a colon in place of the equals are both legal in a
          # properties file and both accepted by Gradle, so reading only one spelling would report
          # a line that is right there as missing.
          version="$(sed -n 's/^[[:space:]]*mod_version[[:space:]]*[=:][[:space:]]*//p' \
            gradle.properties | tr -d '[:space:]')"
          tagged="${TAG#v}"

          # Told apart from a mismatch on purpose: an empty answer means the line was renamed,
          # commented out or moved, and reporting that as a bad tag sends whoever reads it to the
          # wrong file.
          if [ -z "$version" ]; then
            echo "::error::gradle.properties has no mod_version line"
            exit 1
          fi

          if [ "$tagged" != "$version" ]; then
            echo "::error::tag $TAG names $tagged and gradle.properties names $version"
            exit 1
          fi

          # Three numbers, then either -alpha, or -beta, or nothing, which is the shape CONTRIBUTING
          # describes under Branches. Asked of a tag push alone: a release already out was named
          # under whatever rule stood on its day, and this job is dispatched again on old tags to
          # resend a corrected body, which refusing the shape would take away.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta))?$'; then
              echo "::error::$version is not three numbers followed by -alpha, -beta or nothing"
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

          # What marks a release as a pre-release is the version itself: an identifier after a dash
          # is what 0.5.0-beta has and what a finished version does not.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Ahead of the build, and for the reason the tag check is ahead of it: a version nobody wrote
      # an entry for is a mistake worth reporting in seconds rather than after Minecraft has been
      # decompiled. It is also the only thing standing between a release and an empty body, since
      # what the stores are handed is read back off that body further down.
      - name: Take this version's changelog entry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Everything under this version's heading, up to the next one. sed drops the blank line
          # the heading is followed by, which is punctuation of the file rather than content.
          awk -v heading="## $VERSION" '
            $0 == heading { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md | sed '/./,$!d' > changelog.md

          if [ ! -s changelog.md ]; then
            echo "::error::CHANGELOG.md carries no entry under '## $VERSION'"
            exit 1
          fi

      # Every game under versions/, the default first, so that a failure there is the one the log
      # opens on. Read off the directory rather than listed here, a list here being a second home
      # the day a game is added.
      - name: List the games
        id: games
        run: |
          # A tag cut before the tree built for several games has no versions/ and names its one
          # game as minecraft_version, and a dispatched run on such a tag builds that game alone.
          if [ ! -d versions ]; then
            game="$(sed -n 's/^[[:space:]]*minecraft_version[[:space:]]*[=:][[:space:]]*//p' gradle.properties | tr -d '[:space:]')"
            if [ -z "$game" ]; then
              echo "::error::this tag has no versions/ and gradle.properties names no minecraft_version"
              exit 1
            fi
            echo "list=$game" >> "$GITHUB_OUTPUT"
            echo "json=[\"$game\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          default="$(sed -n 's/^[[:space:]]*minecraft[[:space:]]*[=:][[:space:]]*//p' gradle.properties | tr -d '[:space:]')"
          if [ ! -f "versions/$default.properties" ]; then
            echo "::error::gradle.properties names the game '$default', and versions/ holds no $default.properties"
            exit 1
          fi

          games="$default"
          for file in versions/*.properties; do
            game="$(basename "$file" .properties)"
            [ "$game" = "$default" ] || games="$games $game"
          done

          echo "list=$games" >> "$GITHUB_OUTPUT"
          echo "json=[$(printf '"%s",' $games | sed 's/,$//')]" >> "$GITHUB_OUTPUT"

      # The same gradlew build a contributor runs, once per game. What it refuses is whatever
      # build.gradle refuses on the day this runs. Each game builds its own jars into build/libs
      # under names that carry the game, so the builds sit side by side rather than replace each
      # other.
      - name: Build every game
        env:
          GAMES: ${{ steps.games.outputs.list }}
        run: |
          for game in $GAMES; do
            ./gradlew build -Pminecraft="$game"
          done

      # The merged jar is the one that ships; the loader jars are its inputs and sit beside it in
      # build/libs, gathered by collectJars, which assemble depends on. All three are counted per
      # game, so a jar that stopped being built and a jar this list does not know are both a stop
      # rather than a green run: a module added to settings.gradle looks like a fourth jar on the
      # day it lands, and until this file and the mergedJar task both know it, refusing loses
      # nothing.
      - name: Find the jars
        id: jars
        env:
          GAMES: ${{ steps.games.outputs.list }}
        run: |
          shopt -s nullglob

          # The merged jar is the one whose version begins right after the name; the loader jars
          # carry their loader between the two, and every one ends on the game it was built for.
          # Naming the pattern and listing the directory on failure, because the way this fails is
          # a rename in the root build.gradle, and "found 0" beside a folder that visibly holds jars
          # sends whoever reads it looking for a build that did not happen.
          merged=()
          count=0
          for game in $GAMES; do
            jars=(build/libs/vitrail-[0-9]*+mc$game.jar)
            if [ ${#jars[@]} -ne 1 ]; then
              echo "::error::build/libs/vitrail-[0-9]*+mc$game.jar matched ${#jars[@]} files, and build/libs holds: $(ls build/libs)"
              exit 1
            fi
            merged+=("${jars[0]}")

            for loader in neoforge fabric; do
              glob="build/libs/vitrail-$loader-*+mc$game.jar"
              inputs=($glob)
              if [ ${#inputs[@]} -ne 1 ]; then
                echo "::error::$glob matched ${#inputs[@]} files, and build/libs holds: $(ls build/libs)"
                exit 1
              fi
            done
            count=$((count + 3))
          done

          built=(build/libs/*.jar)
          if [ ${#built[@]} -ne $count ]; then
            echo "::error::the list names $count jars, and build/libs holds: $(ls build/libs)"
            exit 1
          fi

          echo "merged=${merged[*]}" >> "$GITHUB_OUTPUT"

      - name: Publish on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TAG: ${{ steps.which.outputs.tag }}
          MERGED_JARS: ${{ steps.jars.outputs.merged }}
        run: |
          # Creating refuses a tag that already carries a release, so a re-run of a job that died
          # after the release was made would have no way back other than deleting a public release.
          # Uploading over it is that way back, and the edit is what finishes the job the dead run
          # left half done: creating with an asset makes the release a draft and publishes it only
          # once the upload lands, so without this line a re-run would end green on a release
          # nobody can see. It costs nothing on a release that is already published, and it is the
          # path a dispatched run ordinarily takes. Ordinarily and not always: dispatched on a tag
          # that carries no release, this makes one, which is the same thing the tag push would
          # have done and is why it is not guarded against.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $MERGED_JARS --clobber
            gh release edit "$TAG" --draft=false
          else
            # The body is this version's changelog entry and not the API's generated list of merged
            # pull requests. There are none to generate from here, the history being linear and
            # pushed rather than merged, so what that flag produced was a bare compare link under a
            # heading; and a body written by hand is the whole point of keeping the file.
            gh release create "$TAG" $MERGED_JARS \
              --title "$TAG" \
              --notes-file changelog.md \
              --prerelease="$PRERELEASE"
          fi

          # Read back rather than remembered, so that a dispatched run sends whatever the body says
          # now instead of what it said when the tag went out.
          gh release view "$TAG" --json body --jq .body > changelog.md

      # One store missing its secrets does not take the other down with it: the action walks its
      # platforms and passes over any whose token is empty, so what is answered here is which of
      # the two is configured rather than whether anything is.
      - name: Which mirrors are configured
        id: mirror
        env:
          CURSEFORGE_ID: ${{ secrets.CURSEFORGE_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          # A project id is not a secret, so it is read from either tab rather than from the one
          # it was guessed to be in. What that saves is the failure this file already carries a
          # scar from: a name read from the wrong context is empty, and an empty name here reads
          # as "not configured" and takes the run green past a store it never wrote to.
          MODRINTH_ID: ${{ secrets.MODRINTH_ID || vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          curseforge=false
          modrinth=false

          # Both halves, because a token without an id is not passed over: it reaches the store and
          # fails there on a project that was never named.
          if [ -n "$CURSEFORGE_ID" ] && [ -n "$CURSEFORGE_TOKEN" ]; then
            curseforge=true
          else
            echo "::notice::CURSEFORGE_ID or CURSEFORGE_TOKEN is not set, so CurseForge is skipped"
          fi

          if [ -n "$MODRINTH_ID" ] && [ -n "$MODRINTH_TOKEN" ]; then
            modrinth=true
          else
            echo "::notice::MODRINTH_ID or MODRINTH_TOKEN is not set, so Modrinth is skipped"
          fi

          echo "curseforge=$curseforge" >> "$GITHUB_OUTPUT"
          echo "modrinth=$modrinth" >> "$GITHUB_OUTPUT"

      # The jars and the changelog the stores are given, handed to the job below as they stand, so
      # that job builds nothing and every store receives the bytes the release above carries.
      - name: Hand the jars to the mirroring job
        if: steps.mirror.outputs.curseforge == 'true' || steps.mirror.outputs.modrinth == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: |
            build/libs/vitrail-[0-9]*.jar
            changelog.md
          if-no-files-found: error
          # Long enough to re-run a failed mirroring leg on a later day, short enough to hold no
          # jar the release itself does not carry.
          retention-days: 7

  # One upload per game, which is one row per game on each store: a store files a file under the
  # game versions it is given, and a jar that runs on one game only is filed under that game alone.
  # One at a time, so two uploads to one store never race, the second one unfeaturing what the
  # first just featured being the kind of question a race leaves open.
  mirror:
    needs: release
    if: needs.release.outputs.curseforge == 'true' || needs.release.outputs.modrinth == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        game: ${{ fromJSON(needs.release.outputs.games) }}

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release

      - name: Find this game's jar
        id: jar
        env:
          GAME: ${{ matrix.game }}
        run: |
          shopt -s nullglob
          # The artifact keeps the paths the release job had, the jars under build/libs and the
          # changelog at the top.
          jars=(build/libs/vitrail-[0-9]*+mc$GAME.jar)
          if [ ${#jars[@]} -ne 1 ]; then
            echo "::error::build/libs/vitrail-[0-9]*+mc$GAME.jar matched ${#jars[@]} files, and the artifact holds: $(ls -R)"
            exit 1
          fi

          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"

      # Every flag the uploaded file needs is given rather than left to be inferred. The two that
      # were learned the hard way on another mod of this account, each added in a commit of its own
      # after a first upload had gone out without them, are `environment` and `java`.
      #
      # The version type is the one thing NOT left to the action, which would read the word out of
      # the version and file an alpha. CurseForge hides an alpha behind a filter its own navigation
      # sets, `showAlphaFiles=hide` on the Files link of every project page, so this one sat behind
      # an empty page: five files uploaded and in place, and a reader who clicked Files told there
      # were no results. Nothing is lost by saying beta here. The word is still in the version
      # number, in the tag, in the GitHub release marked as a prerelease, and in the first paragraph
      # of both store pages, which is where it informs somebody; as a file type it described nothing
      # those do not say and hid the files themselves.
      #
      # `java` is CurseForge's alone. Modrinth has no field for it and the action never sends it
      # there, so the line is not the pair of a missing one.
      #
      # Pinned to a commit like every action here, and this one above all: it is a third party's
      # code handed both store tokens, and a tag is a pointer its owner can move under a run. The
      # comment after it names the tag the commit was taken from.
      - name: Mirror the jar
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          # A token is emptied rather than left to fail when the release job found its store half
          # set, an empty token being exactly what makes the action pass a store over.
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          curseforge-token: ${{ needs.release.outputs.curseforge == 'true' && secrets.CURSEFORGE_TOKEN || '' }}
          modrinth-id: ${{ secrets.MODRINTH_ID || vars.MODRINTH_ID }}
          modrinth-token: ${{ needs.release.outputs.modrinth == 'true' && secrets.MODRINTH_TOKEN || '' }}
          files: ${{ steps.jar.outputs.path }}
          # The two loaders are named in the row's own title because the file does not name them:
          # what ships is one merged jar, where the pair it replaced said neoforge or fabric in the
          # file name. The game is named there too, two rows of one release differing by nothing
          # else. A store lists its files under this title and hangs its own tags elsewhere on the
          # page, so the question a reader arrives with is answered in the list rather than one
          # click further in.
          name: ${{ needs.release.outputs.tag }} for ${{ matrix.game }} (Neo/Fabric)
          version: ${{ needs.release.outputs.version }}+mc${{ matrix.game }}
          version-type: beta
          changelog-file: changelog.md
          loaders: |
            neoforge
            fabric
          game-versions: ${{ matrix.game }}
          environment: client
          java: 25
          # Written out rather than read off the jar, which carries TWO metadata files: whichever
          # one the action read, its list would be wrong for half the audience. Both stores call
          # the whole of Fabric API `fabric-api`; the two modules fabric.mod.json names one by one
          # are projects of neither store and would be dropped in silence. And fabric-api is
          # optional here while that file says required, both on purpose: a store hangs a
          # dependency on the upload as a whole, so `required` would send a NeoForge install
          # chasing a mod that has no NeoForge build, while on Fabric the metadata inside the jar
          # is what refuses to boot without it, which is where the requirement actually bites.
          dependencies: |
            sodium(required)
            chloride(optional)
            fabric-api(optional)
