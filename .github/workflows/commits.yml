# The subject of every commit and the name of the branch carrying them, checked against the one form
# CONTRIBUTING describes. It matters more here than the same check does elsewhere, because a pull
# request enters `dev` with the rebase button: subjects are replayed verbatim rather than collapsed
# into the request's title, so what is written on a branch is what the public history keeps.
#
# It runs `.githooks/commit-msg`, the same file a contributor installs, one message at a time. The
# rule therefore has a single home. A workflow rewriting the same regular expression would be a
# second one, and the two would agree only until somebody changed one of them.
#
# What this adds over the hook is the case the hook cannot cover: whoever never ran the one command
# that installs it, and a pull request from a fork, whose author has read nothing of this repository
# except what is in front of them.
#
# Nothing older than the convention is ever read. The range is the branch's own commits, and the one
# pull request that would carry the whole history, `dev` into `main`, is exempted below.
#
# A second step asks the other thing CONTRIBUTING asks of a branch, that a change a player would
# notice arrive with its changelog entry. It warns and never fails, and the difference is not
# timidity: the rule has a legitimate exception in every direction, a fix nobody sees owing no
# entry, so a refusal would be wrong often enough to be routed around. What it is answering is
# measured rather than imagined: the 0.5.0-beta.1 roll-up found three entries for twenty commits.

name: commits

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    # The release request, and it is the only exemption. It carries everything `dev` holds beyond
    # `main`, which reaches back past the day this convention started; and it carries nothing of its
    # own, every commit in it having already come through a request checked here.
    if: github.base_ref != 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The range below asks what the branch holds that the base does not, so the base's history
          # has to be there to answer it.
          fetch-depth: 0

      - name: Every subject on the branch, and the branch's own name
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

          failed=0
          # The branch's name goes to the first commit alone. The hook would otherwise repeat the
          # same complaint about it once per commit, and a branch has only one name.
          branch=$BRANCH
          for sha in $(git rev-list --reverse "origin/$BASE_REF..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            if ! .githooks/commit-msg "$RUNNER_TEMP/message" "$branch"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha")"
              failed=1
            fi
            branch=
          done

          exit $failed

      # Asked of the branch and not of each commit, which is the whole difference between a warning
      # that is read and one that is routed around. A branch may well carry one entry covering two
      # fixes, and complaining about the second of them would be wrong; a branch carrying visible
      # work and no entry at all is the case that has actually happened here, five times over.
      #
      # It runs even when the step above failed, so that one push answers both complaints.
      - name: The changelog entry a branch owes
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The three types whose subject claims something a player could notice. The other six owe
          # no entry by construction, CONTRIBUTING being explicit that a refactor changing nothing
          # visible gets none.
          subjects="$(git log --format='%h %s' "origin/$BASE_REF..$HEAD_SHA")"
          visible="$(echo "$subjects" | grep -E '^[0-9a-f]+ (feat|fix|perf)(\([a-z0-9-]+\))?!?: ' || true)"

          if [ -z "$visible" ]; then
            exit 0
          fi

          # Three dots, so what is asked is what the branch itself changed rather than what has
          # happened on the base since it left.
          if git diff --name-only "origin/$BASE_REF...$HEAD_SHA" | grep -qx CHANGELOG.md; then
            exit 0
          fi

          # One per commit rather than one for the branch, so each lands on something a reader can
          # click rather than on a count they have to go and resolve themselves.
          echo "$visible" | while read -r line; do
            echo "::warning::$line changes nothing in CHANGELOG.md, and nothing else on this branch does either"
          done
