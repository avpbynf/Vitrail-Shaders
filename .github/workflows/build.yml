# CONTRIBUTING says dev stays buildable, and main only ever holds what dev already held. This runs
# the same gradlew build a contributor runs, so a failure here is reproducible in one command rather
# than something only the runner knows how to provoke.
#
# The local check comes first and always did: a contributor runs the build before pushing, and this
# is the same one. What the remote adds is the case the local check cannot cover, a pull request from
# somebody whose machine nobody here has seen.
#
# A tag does not come through here. release.yml runs the same build itself, before it publishes, so
# routing tags through this file as well would build the same tree twice.
#
# The first run on a fresh cache is slow, since ModDevGradle has to fetch Minecraft and decompile it
# before a single source file is compiled. The cache the setup step keeps makes the later ones
# ordinary.

name: build

on:
  push:
    # Both long-lived branches. main carries nothing dev has not already carried, so a run there is
    # the same tree a second time; it is kept because main is what the badge and anybody arriving at
    # the repository read, and a branch with no run of its own reads as a branch nobody checks.
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request only needs its latest push checked, so a superseded run there is cancelled rather
# than left to finish and report on a commit nobody is looking at any more. A push on one of the
# two long-lived branches is a commit that has landed for good, and every one of those keeps its
# own verdict: two requests merged a minute apart used to leave the first commit with a cancelled
# run, which reads as a failure on the branch and denies that commit the check it earned.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 25

      # A run on either long-lived branch writes the cache, and no other run does. Left to itself
      # the action writes on the default branch alone, which is main, and main moves only at a
      # release: every run in between started from what the last release left, so whatever dev had
      # added since, a dependency or a whole game, was fetched and decompiled again by each of them.
      # A request reads what dev wrote, a run on a request being allowed its base branch's cache,
      # and still writes nothing: an entry of its own would be scoped to its merge ref, and read by
      # nothing but a re-run of that same request.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

      # What this refuses is whatever build.gradle refuses on the day it runs. Naming the gates here
      # as well would only give them a third home to drift out of step with.
      #
      # Once per game the tree builds for, in one job rather than a matrix: the rulesets require a
      # check named build, and a matrix would rename it after each game. The default build comes
      # first, so a failure there is the one the log opens on; the other games follow in the
      # order versions/ lists them.
      - run: ./gradlew build

      - run: ./gradlew build -Pminecraft=26.3
