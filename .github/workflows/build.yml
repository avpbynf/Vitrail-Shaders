# CONTRIBUTING says main stays buildable. This runs the same gradlew build a contributor runs, so
# a failure here is reproducible in one command rather than something only the runner knows how to
# provoke.
#
# The local check comes first and always did: a contributor runs the build before pushing, and this
# is the same one. What the remote adds is the case the local check cannot cover, a pull request from
# somebody whose machine nobody here has seen.
#
# A tag does not come through here. release.yml runs the same build itself, before it publishes, so
# routing tags through this file as well would build the same tree twice.
#
# The first run on a fresh cache is slow, since ModDevGradle has to fetch Minecraft and decompile it
# before a single source file is compiled. The cache the setup step keeps makes the later ones
# ordinary.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch only needs its latest push checked. Superseded runs are cancelled rather than left to
# finish and report on a commit nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # What this refuses is whatever build.gradle refuses on the day it runs. Naming the gates here
      # as well would only give them a third home to drift out of step with.
      - run: ./gradlew build
