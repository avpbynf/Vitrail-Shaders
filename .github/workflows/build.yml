# CONTRIBUTING says main stays buildable. This runs the same gradlew build a contributor runs, so
# a failure here is reproducible in one command rather than something only the runner knows how to
# provoke.
#
# It does not run on its own yet. The check is local for now, before a push rather than after one,
# and this stays here to be launched by hand and to be ready the day the remote should have the
# say as well: uncomment the two triggers below and it takes over.
#
# The first run will be slow whenever that happens, since ModDevGradle has to fetch Minecraft and
# decompile it before a single source file is compiled. The cache the setup step keeps makes the
# later ones ordinary.

name: build

on:
  # push:
  #   branches: [main]
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch only needs its latest push checked. Superseded runs are cancelled rather than left to
# finish and report on a commit nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Compiles both modules, fails on the warnings build.gradle keeps, and runs checkText.
      - run: ./gradlew build
