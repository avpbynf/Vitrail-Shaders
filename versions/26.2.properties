# Everything that follows the game version, for Minecraft 26.2. The build reads the file named by the
# `minecraft` property in gradle.properties, and `-Pminecraft=<version>` picks another one; nothing
# here may also be set in gradle.properties, where it would be read twice and agree only by luck.

# The first game version this jar refuses. Both loaders' metadata take it as the open end of the
# range they accept, so a jar built for one game never loads under the next one.
minecraft_next=26.3

# Toolchain. neoform_version is the bare game, which both the common module and the Fabric one
# compile against; neoforge_version is the build the NeoForge module targets.
neoform_version=26.2-2
neoforge_version=26.2.0.82

# The oldest NeoForge build a player may run it on, and the metadata refuses anything below it. It
# is not the toolchain above, which only decides what the code is compiled against: a floor raised
# with it turns away every player whose loader still carries everything the code reaches.
neoforge_min_version=26.2.0.32-beta

# Provided at runtime by the pack, never bundled.
sodium_version=0.9.2-beta.1+mc26.2

# The two Fabric API modules the key that opens the settings screen goes through, at the versions the
# Fabric API of this game carries. Nothing else of Fabric API is used, and the metadata names these
# two.
fabric_key_mapping_version=2.0.5+e2bdee789e
fabric_lifecycle_version=4.1.4+29b6eb019e
