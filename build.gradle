plugins {
	id "base"
	id "net.ltgt.errorprone" version "4.1.0" apply false
}

subprojects {
	apply plugin: "java"
	apply plugin: "net.ltgt.errorprone"

	group = project.group_id
	version = project.mod_version

	repositories {
		mavenCentral()
	}

	dependencies {
		errorprone "com.google.errorprone:error_prone_core:${project.errorprone_version}"
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
		}
	}

	// A warning nobody is required to fix is a warning nobody reads, so what is kept here is what
	// is wrong rather than what is merely unfashionable, and it fails the build. Four are left out
	// on purpose, and the test each one passes is the same: its findings cannot be about this code.
	// Deprecation, because Minecraft and NeoForge deprecate faster than a mod can follow and the
	// noise would bury everything else; processing, which reports which annotation processor
	// claimed what and is about this build's wiring rather than about anything written here;
	// classfile, which only ever reports annotations missing from a dependency's own jar; and
	// serial, which asks for a serialVersionUID on exceptions nothing serialises.
	//
	// Error Prone contributes the checks it rates as errors, which is the part of its catalogue
	// meant to be a bug rather than a preference, plus the two promoted further down. Its other
	// warnings are worth reading and not worth blocking on, so they are off unless asked for.
	//
	// gradlew build -PlintReport prints what is there without failing, which is how both lists get
	// read when the point is to look at them rather than to gate on them.
	def lintReport = providers.gradleProperty("lintReport").present

	tasks.withType(JavaCompile).configureEach {
		options.encoding = "UTF-8"
		options.release = Integer.parseInt(project.java_version)
		options.compilerArgs += [
				"-Xlint:all,-deprecation,-processing,-classfile,-serial",
				"-Xdoclint:all,-missing",
				// stareval is vendored and its javadoc is its author's. Bending borrowed code to
				// our taste buys nothing and makes the next comparison with upstream harder.
				"-Xdoclint/package:-dev.vitrail.uniform.expr.kroppeb.*",
				// javac prints a hundred of each and stops, and what reaches the reader through
				// Gradle is the bare line "100 warnings" that reads like a count. Both are raised,
				// and on every path rather than under the report flag alone, because a build that
				// fails is a build somebody is about to read a list from. Why this is worth a line
				// at all is in docs/developing.md.
				"-Xmaxwarns", "100000",
				"-Xmaxerrs", "100000",
		]

		if (!lintReport) {
			options.compilerArgs << "-Werror"
		} else {
			// Said by the build itself, because a sentence in a document rots and this cannot.
			//
			// What the flag really disarms is everything that is a WARNING: the lint categories
			// above and the Error Prone findings still rated as warnings. What it cannot disarm is
			// anything javac reports as an ERROR, since -Werror has nothing to say about those.
			// Doclint is one, and so are the two checks promoted below. Measured with a planted
			// defect rather than reasoned about: an earlier version of this line claimed that the
			// flag turned everything off, and it was wrong then for the doclint half of the same
			// reason.
			doFirst {
				logger.lifecycle("lintReport: -Werror is off, so no javac warning and no Error "
						+ "Prone warning can fail this build. What stays armed is what javac calls "
						+ "an error: doclint, and the Error Prone checks this build promotes. This "
						+ "run is a listing, not a check - green here does not mean 'gradlew build' "
						+ "is green.")
			}
		}

		options.errorprone.disableAllWarnings = !lintReport

		// Two warnings promoted to errors. Why those two, and the two places where the promotion
		// does not reach, are in docs/developing.md. What belongs here is the one thing about these
		// lines that is not visible in them: the promotion outlives disableAllWarnings above,
		// because that option rewrites only the checks still RATED a warning and an entry already
		// at error is not one of them. Nothing about it depends on which of these two lines comes
		// first. Settled by planting a single-argument split and watching the build fail on it,
		// under the report flag as well as without it.
		options.errorprone.error("StringSplitter", "OperatorPrecedence")

		// Mixins are outside what this analyser can model, so it is pointed away from them rather
		// than argued with. A handler is called by the mixin framework and never from our own code,
		// and its parameters have to match the target method whether it reads them or not: every
		// one of them reads as unused. Measured before deciding, on the report of 6 August: sixty
		// of the hundred and sixty four findings were UnusedMethod or UnusedVariable and ALL sixty
		// were in this one package, none of them dead. Acting on a single one would have deleted a
		// handler the game calls, and with the defaultRequire this config carries it would have
		// failed in silence, which is the trap DefaultFluidRendererMixin already documents.
		//
		// Only this analyser steps back. The javac warnings still apply here and are still errors,
		// and they are the ones that catch a real mistake in a mixin.
		//
		// It steps back whole, promotions included: a single-argument split planted in this package
		// compiles green, measured rather than assumed. What the pattern names is a path and not a
		// module, so it is this package that steps back and nothing else does.
		//
		// The vendored evaluator steps back for the reason already written three times about its
		// javadoc, above at -Xdoclint/package, in CONTRIBUTING and in developing: the code is its
		// author's, and bending it to this project's taste makes the next comparison with upstream
		// harder. Answering this analyser file by file is bending it - a cast rewritten as a pattern
		// and a summary line added are both a diff against Iris that nothing asked for. Pointing the
		// analyser away is the same answer the javadoc gate already gives, in one place instead of
		// seven. It costs the two promotions inside that package, and a parser is a place where
		// OperatorPrecedence would be worth having: that is the price of not owning the code.
		options.errorprone.excludedPaths = ".*/neoforge/mixin/.*|.*/uniform/expr/kroppeb/.*"
	}

	tasks.withType(AbstractArchiveTask).configureEach {
		preserveFileTimestamps = false
		reproducibleFileOrder = true
	}
}

// Two text rules no compiler can see. The byte order mark is the one that costs an afternoon: it
// reaches a GLSL compiler as a stray character in front of the version directive, and PowerShell
// writes one unless told not to. Typographic punctuation is house style and nothing more, but
// nothing else keeps it, and it arrives by copy and paste rather than by typing.
tasks.register("checkText") {
	group = "verification"
	description = "Rejects a byte order mark or typographic punctuation in a text file."

	// Only what the repository ships. Binary resources are skipped by extension rather than by
	// listing them, so a new icon does not have to be remembered here.
	def texts = fileTree(rootDir) {
		include "*.md", "*.gradle", "*.properties", ".gitattributes", ".gitignore"
		include "common/src/**", "neoforge/src/**", "fabric/src/**", ".github/**"
		// docs/ is prose rather than code, which is exactly why it needs this: a curly quote
		// pasted from a browser is invisible in a diff and reaches the published page.
		include "docs/**"
		exclude "**/*.png", "**/*.jpg", "**/*.jar", "**/*.zip"
	}
	def root = rootDir.toPath()

	// En and em dashes, curly quotes, the ellipsis character and the non-breaking space. Written
	// as escapes so that this file passes its own check.
	def typographic = ~"[\\u2013\\u2014\\u2018\\u2019\\u201C\\u201D\\u2026\\u00A0]"

	inputs.files(texts).withPathSensitivity(PathSensitivity.RELATIVE)

	doLast {
		def wrong = []

		texts.each { file ->
			def path = root.relativize(file.toPath())
			def bytes = file.bytes

			if (bytes.length >= 3 && bytes[0] == (byte) 0xEF && bytes[1] == (byte) 0xBB && bytes[2] == (byte) 0xBF) {
				wrong << "$path: byte order mark"
			}

			new String(bytes, "UTF-8").readLines().eachWithIndex { line, index ->
				def found = typographic.matcher(line)
				if (found.find()) {
					def codePoint = String.format("U+%04X", (int) found.group().charAt(0))
					wrong << "$path:${index + 1}: $codePoint, use plain ASCII punctuation"
				}
			}
		}

		if (wrong) {
			throw new GradleException("${wrong.size()} text rule violations:\n  " + wrong.join("\n  "))
		}
	}
}

tasks.named("check") {
	dependsOn tasks.named("checkText")
}

// Loader jars are what gets shipped, so gather them at the root rather than making
// people dig through each module.
tasks.register("collectJars", Copy) {
	from project(":neoforge").tasks.named("jar")
	into layout.buildDirectory.dir("libs")
}

tasks.named("assemble") {
	dependsOn tasks.named("collectJars")
}
