plugins {
	id "net.neoforged.moddev" version "${moddev_version}"
}

base {
	archivesName = "vitrail-common"
}

neoForge {
	// Vanilla Minecraft only. Nothing in this module may reference a mod loader,
	// so that the Fabric module can reuse it as is.
	neoFormVersion = project.neoform_version
}

repositories {
	maven {
		name = "FabricMC"
		url = "https://maven.fabricmc.net/"
	}
	maven {
		name = "CaffeineMC"
		url = "https://maven.caffeinemc.net/releases"
	}
}

dependencies {
	// Mixin and MixinExtras are libraries rather than loaders, which is why the mixins live here
	// with the engine they call into rather than once per loader module. Both loaders bring their
	// own copy at runtime, so both are compile only: NeoForge ships Mixin 0.8.7 and bundles
	// MixinExtras, and Fabric Loader ships this very artifact and has bundled MixinExtras since
	// 0.15. What is written against here is the annotation set, which is the same upstream 0.8.7
	// on either side.
	compileOnly "net.fabricmc:sponge-mixin:${project.mixin_version}"
	compileOnly "io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"

	// Sodium ships with the pack, so it is never bundled and never remapped.
	//
	// The Fabric artifact rather than the NeoForge one, and it is the plain jar: what Maven serves
	// under sodium-neoforge is a launcher shim of seventy-two classes with the renderer in a jar
	// inside it, under META-INF/jarjar. Compiling against the outer jar looks like it works right
	// up to the first import.
	//
	// Which of the two is compiled against was settled by comparing them class by class rather than
	// by argument. Of the 732 classes the NeoForge jar carries at 0.9.2-alpha.4, 704 are byte for
	// byte identical to the Fabric one, 25 exist only there and are all under sodium's own neoforge
	// and mixin.platform.neoforge packages, and 3 differ and are all sodium mixins. Everything this
	// module names is in the identical set.
	compileOnly("net.caffeinemc:sodium-fabric:${project.sodium_version}") {
		transitive = false
	}
}

// The mod's logo, again, under a name the texture manager can reach: it is what Sodium is handed as
// the icon of the page this mod adds to the video settings, and the texture manager only loads from
// assets/. Copied by the build rather than kept twice in the tree, because two copies of one image
// drift the day somebody redraws it and only finds one of them. Both loaders still take the file at
// the jar's root for their mod list, which is where each of them looks.
tasks.named("processResources", ProcessResources).configure {
	from("src/main/resources/vitrail.png") {
		into "assets/vitrail/textures/gui"
		rename { "config-icon.png" }
	}
}
