org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

group_id=dev.vitrail
mod_id=vitrail
mod_version=0.1.0-alpha.1
java_version=25

# Toolchain. neoform_version is the bare game, which both the common module and the Fabric one
# compile against; neoforge_version is the build the NeoForge module targets. The Fabric loader is
# only ever compiled against, never remapped for: from 26.2 on there is one set of names.
minecraft_version=26.2
neoform_version=26.2-2
neoforge_version=26.2.0.32-beta
fabric_loader_version=0.19.3
moddev_version=2.0.143

# Provided at runtime by the pack, never bundled.
sodium_version=0.9.1+mc26.2

# Provided at runtime by whichever loader is in front, never bundled either. The Mixin version is
# the one Fabric Loader ships; NeoForge carries the same upstream 0.8.7 under its own coordinates.
mixin_version=0.17.3+mixin.0.8.7
mixinextras_version=0.5.4

# The three Fabric API modules the settings screen is reached through, at the versions the current
# Fabric API carries. Nothing else of Fabric API is used, and the metadata names these three.
fabric_key_mapping_version=2.0.5+e2bdee789e
fabric_screen_version=5.2.0+58e078ad9e
fabric_lifecycle_version=4.1.3+4575b05f9e

# Static analysis. Only the checks it rates as errors fail the build; see build.gradle.
errorprone_version=2.50.0
