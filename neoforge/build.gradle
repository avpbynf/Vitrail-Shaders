plugins {
	id "net.neoforged.moddev" version "${moddev_version}"
}

evaluationDependsOn(":common")

base {
	archivesName = "vitrail-neoforge"
}

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
		}
	}

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
			sourceSet project(":common").sourceSets.main
		}
	}
}

repositories {
	maven {
		name = "CaffeineMC"
		url = "https://maven.caffeinemc.net/releases"
	}
}

configurations {
	sodium
}

dependencies {
	compileOnly project(":common")

	// Sodium ships with the pack, so it is never bundled and never remapped.
	sodium("net.caffeinemc:sodium-neoforge:${project.sodium_version}") {
		transitive = false
	}

	// What Maven serves under that name is a launcher shim: seventy-two classes, none of them the
	// renderer. The mod itself is a jar inside it, under META-INF/jarjar, and that is the one
	// carrying net.caffeinemc.mods.sodium.client. Compiling against the outer jar looks like it
	// works right up to the first import.
	compileOnly files(provider {
		zipTree(configurations.sodium.singleFile).matching { include "META-INF/jarjar/*.jar" }.files
	})
}

tasks.named("processResources", ProcessResources).configure {
	def metadata = [
		mod_id: project.mod_id,
		mod_version: project.mod_version,
		minecraft_version: project.minecraft_version,
		neoforge_version: project.neoforge_version
	]

	inputs.properties(metadata)

	filesMatching("META-INF/neoforge.mods.toml") {
		expand(metadata)
	}
}

tasks.named("jar", Jar).configure {
	archiveVersion = "${project.mod_version}+mc${project.minecraft_version}"
	from project(":common").sourceSets.main.output

	// The licence has to reach whoever receives the program, and what they receive is this jar.
	// A licence field in the metadata is a declaration, not a copy.
	from(rootDir) {
		include "LICENSE"
		include "GPL-3.0.txt"
		include "NOTICE"
	}
}
