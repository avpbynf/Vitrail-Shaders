modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0-only"
issueTrackerURL = "https://github.com/avpbynf/vitrail/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Vitrail"
displayURL = "https://github.com/avpbynf/vitrail"
logoFile = "vitrail.png"
authors = "avpbynf"
displayTest = "IGNORE_ALL_VERSION"
description = '''
Minecraft 26.2 ships a native Vulkan renderer alongside the OpenGL one, and the shader
ecosystem has not crossed over yet. Vitrail loads existing OptiFine-format packs, unmodified,
on the Vulkan backend, so that turning Vulkan on does not mean giving up the packs you use.

Pack GLSL is rewritten once, when the pack is loaded, and compiled to SPIR-V by the compiler
the game already ships. Nothing is translated per frame.

Still early: the terrain, the water, the shadow map, the overworld sky and its clouds already
run on the pack's own programs, with the pack's full pass chain and settings screen; the
entities and the particles still come from the game.
'''

# Sodium reads this block out of every mod's own metadata and turns the named mixin off.
# features.render.world.sky hides the whole sky pass whenever the camera is in a fluid, which with a
# pack loaded means no sky at all: none of the six elements is drawn, so none of the pack's sky
# programs runs. LevelRendererSkyMixin puts the same answer back where no pack draws the sky.
[mods."sodium:options"]
"mixin.features.render.world.sky" = false

[[mixins]]
config = "vitrail.mixins.json"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},26.3)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},26.3)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "sodium"
type = "required"
reason = "Vitrail renders through Sodium, which owns the Vulkan command submission."
versionRange = "[0.9,0.10)"
ordering = "AFTER"
side = "CLIENT"
